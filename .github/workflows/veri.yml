name: Verificador de Enlaces

on: [push] # Se activa cada vez que subes cambios

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escanear Links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          # Revisa todos los archivos Markdown (.md) del proyecto
          args: --verbose --no-progress './**/*.md' 
          # Si encuentra un error, falla el workflow para avisarte
          fail: true